spring:
  application:
    name: youtube-live-monitor-test

  # 本番の data/monitor.mv.db には絶対に触れない（実データが入っている）。
  # テストはインメモリDBを使い、起動のたびにスキーマを作り直す。
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

monitor:
  # Spring を起動するテストで、配信の監視と動画の収集を定期実行させない。動いたままだと、
  # テストの最中に巡回が並行して走ってログを増やし、テストが入れたチャンネルを拾いうる（#187）。
  # 巡回そのもののテストは Spring を通さずに組み立てるので、この値の影響を受けない。
  scheduling:
    enabled: false

  # SecurityConfigTest がログインできるよう、テスト用の初期管理者を明示的に指定する。
  admin:
    username: testadmin
    password: test-admin-password

  # 「ログインしたままにする」の鍵を本物の data/ に作らない。
  security:
    remember-me-key-file: ${java.io.tmpdir}/youtube-live-monitor-test/remember-me.key
