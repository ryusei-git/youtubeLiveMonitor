spring:
  application:
    name: youtube-live-monitor

  # 画面ファイル（static/ 配下の HTML/CSS/JS）のキャッシュ制御。
  # 既定では Cache-Control が付かず、ブラウザが独自判断で古い内容を保持するため、
  # 画面を更新してもハードリロードするまで反映されない（実際に発生した）。
  # no-cache は「キャッシュを使う前に必ず問い合わせる」指定で、変更が無ければ 304 が返る。
  # 録画ファイル（/recordings/**）は RecordingResourceConfig が別に登録しているため対象外。
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

  datasource:
    url: jdbc:h2:file:./data/monitor;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    # 空だと、同じ端末のほかのユーザー・プロセスが AUTO_SERVER の口からパスワード無しでつながり、
    # CREATE ALIAS で任意の Java を実行できる（#240）。値は .env から読む。
    # 既存の DB は作ったときのパスワード（空）のままなので、ここを変える前に ALTER USER が要る
    # （順番を誤ると起動しなくなる。手順は .env.example の SPRING_DATASOURCE_PASSWORD）。
    password: ${SPRING_DATASOURCE_PASSWORD:}
    # 接続プール（Hikari）の既定は、使っていなくても常に 10 本を開いたままにする
    # （minimum-idle の既定が maximum-pool-size と同じ）。個人用の規模では、同時に DB を使うのは
    # 画面を開いたときに並ぶ API（1 本は数十ミリ秒）くらいで 10 本は要らない（#184）。
    # minimum-idle: 1 で、10 分使わなかった接続を 1 本まで閉じさせる（Hikari の idle-timeout の既定）。
    # 同じ JVM の中の H2 への接続はすぐ作れるので、足りないときに作り足しても画面は待たされない。
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  # Jackson 3（Boot 4）は FAIL_ON_NULL_FOR_PRIMITIVES などの既定が Jackson 2 と違い、
  # ChannelRegistrationRequest.recordEnabled などの primitive の boolean が JSON に無いと、
  # 検証の 400 ではなく「予期しないエラー」の 500 になる（#320 で確認）。
  # Boot が用意している「3.x の Jackson 2 と同じ既定にする」設定で、今の API の振る舞いを変えない
  jackson:
    use-jackson2-defaults: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      # 本番では無効（管理者のセッション 1 つで CREATE ALIAS から端末ごと乗っ取れるため、#312）。
      # 使うときだけ -Dspring.h2.console.enabled=true で起動する。
      enabled: false
      path: /h2-console

  # @Scheduled は既定では 1 スレッドを取り合う。巡回（LiveStreamPollingScheduler）が固まると、
  # 録画の後始末・動画収集の起動・資源の記録まで止まるので、定期処理の数だけ用意する（#243）。
  # 後始末と動画収集は仮想スレッドへ逃がし、AtomicBoolean で自分の重複を防いでいるので、
  # スレッドを増やしても新しく同時に動く組み合わせは「巡回」と「資源の記録」だけ（共有する状態は無い）
  task:
    scheduling:
      pool:
        size: 4

# ログ出力の設定は logback-spring.xml 側で一元管理する

monitor:
  # false にすると配信の監視（定期・「今すぐチェック」）と動画の収集を行わない。
  # 本番を止めずに画面を確かめる確認用の起動（bin/preview.sh）が使う。本番では true のまま
  scheduling:
    enabled: true

  youtube:
    api-key: ${YOUTUBE_API_KEY:}
    interval-seconds: ${MONITOR_INTERVAL_SECONDS:120}

  twitch:
    client-id: ${TWITCH_CLIENT_ID:}
    client-secret: ${TWITCH_CLIENT_SECRET:}

  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL:}

  recording:
    directory: ${MONITOR_RECORDING_DIRECTORY:recordings}
    max-height: ${MONITOR_RECORDING_MAX_HEIGHT:0}
    # 空き容量（GB）がこれを下回っていれば録画を始めない（StreamRecorder）。0 で確認しない。
    min-free-gb: ${MONITOR_RECORDING_MIN_FREE_GB:20}

  # 起動時に管理者が1人もいなければ、この値から初期管理者を作成する（AdminUserInitializer）。
  # 一度作成された後はこの値を変えても上書きされない（管理者が既に存在するため）。
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
