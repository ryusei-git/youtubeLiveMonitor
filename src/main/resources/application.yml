# 外からは tailscale serve の HTTPS だけを通す（#308）。全インターフェースで待ち受けると、
# LAN やグローバル IPv6 からパスワードとセッションの Cookie が平文で流れる。
# LAN から直接開きたいときは .env に SERVER_ADDRESS=0.0.0.0 を書く（手順は README「外から使う」）。
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  # プロキシ経由だと接続元が全員 127.0.0.1 になり、ログイン試行の IP ごとの制限（LoginAttemptLimiter）が
  # 全員で 1 つの枠を共有し、監査ログの IP も区別できなくなる。X-Forwarded-For・X-Forwarded-Proto を
  # Tomcat に読ませ、getRemoteAddr() を本来の接続元、ログイン後のリダイレクトを https にする。
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # ヘッダーを信じるのはループバック（同じ端末の tailscale serve）から来た要求だけにする。
      # 既定の信頼範囲には Tailscale の 100.64.0.0/10 や LAN のアドレスが含まれ、tailnet や LAN から
      # 直接つないだ人が X-Forwarded-For を偽装してログイン試行の制限をすり抜けられるため。
      internal-proxies: '127\.\d{1,3}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1'
  # セッションの Cookie（JSESSIONID）の属性を明示する（#310）。
  servlet:
    session:
      # 操作が無いまま 30 分でセッションを失効させる（Spring Boot の既定と同じ値を、意図して選んだものとして書く）。
      # Cookie 自体には期限（Max-Age）を付けない。付けても Tomcat は要求のたびに延ばさないので、
      # 使っている最中でも決まった時刻にログアウトさせられてしまう。ブラウザを閉じれば消える Cookie のままにする。
      timeout: 30m
      cookie:
        # 平文の HTTP へ Cookie が漏れないよう、Secure を常に付ける。
        # localhost / 127.0.0.1 は curl・Chromium とも安全な接続先として扱うので、
        # http://localhost の bin/api.sh・bin/preview.sh・Playwright はこのままでログインできる（#310 で確認）。
        # SERVER_ADDRESS=0.0.0.0 で LAN から http://192.168.x.x を開くときだけは、ブラウザが Secure の
        # Cookie を捨ててログインできなくなるので、.env に SESSION_COOKIE_SECURE=false を書く。
        # false にしても、tailscale serve を通った要求（X-Forwarded-Proto: https）には Tomcat が Secure を付ける。
        secure: ${SESSION_COOKIE_SECURE:true}
        # 別サイトから始まる POST などに Cookie を載せない。Strict にすると、Discord の通知のリンクから
        # 開いたときにログインしていない扱いになるので Lax にする。
        same-site: lax

spring:
  application:
    name: youtube-live-monitor

  # 画面ファイル（static/ 配下の HTML/CSS/JS）のキャッシュ制御。
  # 既定では Cache-Control が付かず、ブラウザが独自判断で古い内容を保持するため、
  # 画面を更新してもハードリロードするまで反映されない（実際に発生した）。
  # no-cache は「キャッシュを使う前に必ず問い合わせる」指定で、変更が無ければ 304 が返る。
  # 録画ファイル（/recordings/**）は RecordingResourceConfig が別に登録しているため対象外。
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

  datasource:
    url: jdbc:h2:file:./data/monitor;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    # 空だと、同じ端末のほかのユーザー・プロセスが AUTO_SERVER の口からパスワード無しでつながり、
    # CREATE ALIAS で任意の Java を実行できる（#240）。値は .env から読む。
    # 既存の DB は作ったときのパスワード（空）のままなので、ここを変える前に ALTER USER が要る
    # （順番を誤ると起動しなくなる。手順は .env.example の SPRING_DATASOURCE_PASSWORD）。
    password: ${SPRING_DATASOURCE_PASSWORD:}
    # 接続プール（Hikari）の既定は、使っていなくても常に 10 本を開いたままにする
    # （minimum-idle の既定が maximum-pool-size と同じ）。個人用の規模では、同時に DB を使うのは
    # 画面を開いたときに並ぶ API（1 本は数十ミリ秒）くらいで 10 本は要らない（#184）。
    # minimum-idle: 1 で、10 分使わなかった接続を 1 本まで閉じさせる（Hikari の idle-timeout の既定）。
    # 同じ JVM の中の H2 への接続はすぐ作れるので、足りないときに作り足しても画面は待たされない。
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  # Jackson 3（Boot 4）は FAIL_ON_NULL_FOR_PRIMITIVES などの既定が Jackson 2 と違い、
  # ChannelRegistrationRequest.recordEnabled などの primitive の boolean が JSON に無いと、
  # 検証の 400 ではなく「予期しないエラー」の 500 になる（#320 で確認）。
  # Boot が用意している「3.x の Jackson 2 と同じ既定にする」設定で、今の API の振る舞いを変えない
  jackson:
    use-jackson2-defaults: true

  jpa:
    # 要求の間ずっと DB の接続を握らせない（Open Session in View を切る）。
    # 既定の true だと、要求の中で一度 DB を読むと、応答を書き終えるまで接続を返さない
    # （Spring は Hibernate に接続を EntityManager が閉じるまで持たせる）。端末保存のダウンロード
    # （数 GB を送り切るまで）や「今すぐチェック」（巡回 1 周を待つ）が接続を握る。接続は上の hikari で
    # 5 本に絞っているので、5 本とも長い要求に握られると、定期巡回が接続を待ったまま失敗する。
    # 切ると、トランザクションの外（コントローラーでの詰め替え）で遅延読み込みの関連を読んだときに
    # LazyInitializationException になる。画面へ返すためにチャンネルを読むクエリには
    # @EntityGraph(attributePaths = "channel") を付けてある（NotificationHistoryRepository・
    # RecordingRepository・OnlineVideoRepository）。関連を読む API を足すときも同じようにする。
    # 未指定だと、起動のたびに「spring.jpa.open-in-view is enabled by default」の WARN も出る。
    # テストは src/test/resources/application.yml を読むので、この設定はテストには効かない。
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      # 本番では無効（管理者のセッション 1 つで CREATE ALIAS から端末ごと乗っ取れるため、#312）。
      # 使うときだけ -Dspring.h2.console.enabled=true で起動する。
      enabled: false
      path: /h2-console

  # @Scheduled は既定では 1 スレッドを取り合う。巡回（LiveStreamPollingScheduler）が固まると、
  # 録画の後始末・動画収集の起動・資源の記録まで止まるので、定期処理の数だけ用意する（#243）。
  # 後始末と動画収集は仮想スレッドへ逃がし、AtomicBoolean で自分の重複を防いでいるので、
  # スレッドを増やしても新しく同時に動く組み合わせは「巡回」と「資源の記録」だけ（共有する状態は無い）
  task:
    scheduling:
      pool:
        size: 4

# ログ出力の設定は logback-spring.xml 側で一元管理する

monitor:
  # false にすると配信の監視（定期・「今すぐチェック」）と動画の収集を行わない。
  # 本番を止めずに画面を確かめる確認用の起動（bin/preview.sh）が使う。本番では true のまま
  scheduling:
    enabled: true

  # 録画が終わった録画に耳キスの検出を掛ける見回り（SoundDetectionScheduler）。
  sound-detection:
    # 既定は monitor.scheduling.enabled と同じにする。確認用の起動（bin/preview.sh）は監視を止めるだけで検出も止まり、
    # 本番と同じ録画を二重に検出して CPU を取り合わない。検出だけを試すときは -Dmonitor.sound-detection.enabled=true
    enabled: ${MONITOR_SOUND_DETECTION_ENABLED:${monitor.scheduling.enabled:true}}
    # 見回りの間隔。1 回で対象の録画を全部（1 本ずつ）処理するので、録画が終わってから候補が付くまでの待ち時間になる
    interval: PT10M

  # 新人 VTuber の発掘（DiscoveryService・DiscoveryScheduler、#488）。
  discovery:
    # 既定は monitor.scheduling.enabled と同じ。確認用の起動（bin/preview.sh）で検索の回数を使わないため
    enabled: ${MONITOR_DISCOVERY_ENABLED:${monitor.scheduling.enabled:true}}
    # 日本時間の 03:00・11:00・19:00。4 語 × 3 回 = 検索 12 回で、発掘の枠（search.discovery-limit）と同じ
    cron: ${MONITOR_DISCOVERY_CRON:0 0 3,11,19 * * *}
    # 30 日の決まりの見回り（日本時間の 04:30。検索の直後を避ける）
    sweep-cron: ${MONITOR_DISCOVERY_SWEEP_CRON:0 30 4 * * *}
    # 検索語（カンマ区切り。1 語で検索 1 回）
    terms: ${MONITOR_DISCOVERY_TERMS:新人VTuber|新人Vtuber,初配信 VTuber,個人勢VTuber,デビュー配信 VTuber}
    # VTuber らしさの語（カンマ区切り）。チャンネルの説明と見つけた動画のタイトルのどれかに含まれれば候補にする
    words: ${MONITOR_DISCOVERY_WORDS:VTuber,Vtuber,バーチャル,Live2D,個人勢,初配信,新人}
    max-subscribers: ${MONITOR_DISCOVERY_MAX_SUBSCRIBERS:1000}
    max-videos: ${MONITOR_DISCOVERY_MAX_VIDEOS:10}
    # 規約（API のデータは 30 日以内に取り直すか消す）に余裕を持たせて 20 日で取り直す
    refresh-days: 20
    # 判定されないまま 30 日たった候補は消す
    expire-days: 30

  youtube:
    api-key: ${YOUTUBE_API_KEY:}
    interval-seconds: ${MONITOR_INTERVAL_SECONDS:120}
    # 検索（search.list）の 1 日の回数の上限。既定値の理由は YouTubeSearchBudget の JavaDoc。
    # その場の検索の上限は daily-limit - discovery-limit（発掘の枠を対話が食わない）。
    search:
      daily-limit: ${YOUTUBE_SEARCH_DAILY_LIMIT:52}
      discovery-limit: ${YOUTUBE_SEARCH_DISCOVERY_LIMIT:12}
      per-user-limit: ${YOUTUBE_SEARCH_PER_USER_LIMIT:10}

  twitch:
    client-id: ${TWITCH_CLIENT_ID:}
    client-secret: ${TWITCH_CLIENT_SECRET:}

  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL:}

  recording:
    directory: ${MONITOR_RECORDING_DIRECTORY:recordings}
    max-height: ${MONITOR_RECORDING_MAX_HEIGHT:0}
    # 空き容量（GB）がこれを下回っていれば録画を始めない（StreamRecorder）。0 で確認しない。
    min-free-gb: ${MONITOR_RECORDING_MIN_FREE_GB:20}
    # yt-dlp に --js-runtimes で渡す JavaScript のランタイム（例: node:/path/to/node）。空なら付けない（YtDlpJsRuntime）。
    js-runtime: ${MONITOR_YTDLP_JS_RUNTIME:}
    # yt-dlp に --cookies で渡す Cookie ファイル（Netscape 形式）。ファイルがあるときだけ、その写しを渡す（YtDlpCookies）。
    # 置くだけで効くよう、既定の置き場所を決めている（data/ は本人だけが読める）。相対パスは作業ディレクトリ基準。
    cookies-file: ${MONITOR_YTDLP_COOKIES:data/youtube-cookies.txt}

  # 起動時に管理者が1人もいなければ、この値から初期管理者を作成する（AdminUserInitializer）。
  # 一度作成された後はこの値を変えても上書きされない（管理者が既に存在するため）。
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}

  security:
    # 「ログインしたままにする」の Cookie に署名する鍵（SecurityConfig・RememberMeKeyFile）。
    # 無ければ起動時に作る。消して再起動すると、全員の「ログインしたまま」が無効になる。
    remember-me-key-file: ${MONITOR_REMEMBER_ME_KEY_FILE:data/remember-me.key}
