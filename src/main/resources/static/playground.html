<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APIお試し - YouTube Live Monitor</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/studio.css">
<link rel="stylesheet" href="/css/playground.css">
</head>
<body>
<header class="masthead">
  <div class="shell">
    <a class="brand" href="/index.html">
      <span class="brand-name">LIVE MONITOR</span>
      <span class="brand-sub">配信と録画を、ひとつの場所に。</span>
    </a>
  </div>
</header>
<nav class="globalnav" aria-label="メインメニュー">
  <div class="shell">
    <a href="/videos.html">動画・配信</a>
    <a href="/index.html">ダッシュボード</a>
    <a href="/channels.html">チャンネル</a>
    <a href="/notifications.html">通知履歴</a>
    <a href="/recordings.html">録画</a>
    <a href="/users.html">利用者管理</a>
    <a href="/invitations.html">招待</a>
    <a href="/logs.html">ログ</a>
    <a href="/tables.html">DB管理</a>
    <!-- playground:start -->
    <a href="/playground.html" class="active">APIお試し</a>
    <!-- playground:end -->
  </div>
</nav>
<main class="shell" id="mainContent">
  <div class="pageHead">
    <h1>APIお試し</h1>
    <div class="pageActions">
      <span class="muted">この画面で消費したクォータ <strong id="quotaTotal">0</strong></span>
    </div>
  </div>
  <p id="error" role="alert" class="error" style="display:none;"></p>

  <p class="quotaNotice">
    この画面は<strong>監視機能と同じAPIキー</strong>を使います。1日の上限は既定10,000で、
    使い切ると配信検知後の詳細取得（<code>videos.list</code>）や通知まで失敗するようになります。
    <code>search.list</code> は1回100消費するため特に注意してください。
  </p>

  <div class="playgroundRow">
    <div>
      <h2>リクエスト</h2>
      <form id="apiForm">
        <label class="fieldLabel" for="apiSelect">API</label>
        <select id="apiSelect"></select>
        <p class="muted" id="apiDescription"></p>

        <div id="apiParameters"></div>

        <div class="inline">
          <button type="submit" id="executeBtn">実行</button>
          <span id="executeStatus" class="muted"></span>
        </div>
      </form>
    </div>

    <div>
      <h2>レスポンス <span class="hint" title="YouTube Data API が返したJSONをそのまま表示しています。整形以外の加工はしていません。">ⓘ</span></h2>
      <div class="responseMeta" id="responseMeta"></div>
      <pre class="responseBody" id="responseBody">APIを選んで「実行」を押してください。</pre>
    </div>
  </div>
</main>
<script src="/js/common.js"></script>
<script src="/js/playground.js"></script>
</body>
</html>
