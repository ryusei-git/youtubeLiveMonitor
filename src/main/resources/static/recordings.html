<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アーカイブ一覧 - YouTube Live Monitor</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/studio.css">
</head>
<body>
<header class="masthead">
  <div class="shell">
    <a class="brand" href="/index.html">
      <span class="brand-name">LIVE MONITOR</span>
      <span class="brand-sub">配信と録画を、ひとつの場所に。</span>
    </a>
  </div>
</header>
<nav class="globalnav" aria-label="メインメニュー">
  <div class="shell">
    <a href="/videos.html">動画・配信</a>
    <a href="/index.html">ダッシュボード</a>
    <a href="/channels.html">チャンネル</a>
    <a href="/notifications.html">通知履歴</a>
    <a href="/recordings.html" class="active">録画</a>
    <a href="/users.html">利用者管理</a>
    <a href="/invitations.html">招待</a>
    <a href="/logs.html">ログ</a>
    <a href="/audit.html">監査ログ</a>
    <a href="/tables.html">DB管理</a>
  </div>
</nav>
<main class="shell" id="mainContent">
  <h1>アーカイブ一覧</h1>
  <p class="pageDescription">見たい配信を見つけて、好きなときに再生。</p>
  <p id="error" role="alert" class="error" style="display:none;"></p>

  <h2>録画一覧 <span class="hint" title="サムネイルまたはタイトルをクリックすると再生画面へ移動します。">ⓘ</span></h2>
  <form id="filterForm" class="inline">
    <input type="search" name="keyword" placeholder="タイトル・チャンネル名で検索">
    <button type="submit">検索</button>
    <details class="filterMore">
      <summary aria-expanded="false">絞り込み・並び順<small class="filterCount"></small></summary>
      <div class="inline">
        <select id="channelFilter" name="channelId"><option value="">全チャンネル</option></select>
        <select name="status">
          <option value="">すべての状態</option>
          <option value="COMPLETED">完了</option>
          <option value="PARTIAL">途中まで</option>
          <option value="RECORDING">録画中</option>
          <option value="FAILED">失敗</option>
        </select>
        <select id="genreFilter" name="genre" aria-label="ジャンル"><option value="">すべてのジャンル</option></select>
        <label>期間 <input type="date" name="from" aria-label="期間の開始日"> 〜 <input type="date" name="to" aria-label="期間の終了日"></label>
        <select name="sort" aria-label="並び順">
          <option value="newest">新しい順</option>
          <option value="oldest">古い順</option>
          <option value="longest">長い順</option>
          <option value="largest">サイズが大きい順</option>
        </select>
        <select name="size" aria-label="表示件数">
          <option value="24">24件ずつ</option>
          <option value="48">48件ずつ</option>
          <option value="96">96件ずつ</option>
        </select>
        <select name="watched" aria-label="視聴">
          <option value="">すべて</option>
          <option value="unwatched">未視聴</option>
          <option value="watched">視聴済み</option>
        </select>
        <label><input type="checkbox" name="favorite"> お気に入りのみ</label>
        <button type="reset">条件をクリア</button>
      </div>
    </details>
  </form>

  <div class="inline">
    <div class="viewToggle" role="group" aria-label="表示">
      <button type="button" class="cardViewBtn" aria-pressed="true">カード</button>
      <button type="button" class="listViewBtn" aria-pressed="false">リスト</button>
    </div>
    <span id="resultSummary" class="muted"></span>
  </div>
  <div class="videoGrid" id="videoGrid"></div>
  <div class="table-scroll" id="recordingList" hidden>
    <table id="recordingTable">
      <thead><tr><th>開始日時</th><th>チャンネル</th><th>タイトル</th><th>長さ</th><th>サイズ</th><th>状態</th><th>ジャンル</th><th>視聴</th><th>★</th><th>（削除）</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <nav class="inline" id="pager" aria-label="ページ送り">
    <button class="prevBtn">前へ</button>
    <span class="pageNumbers" style="display:contents"></span>
    <button class="nextBtn">次へ</button>
  </nav>
  <details class="utilityPanel" id="recordingTools">
    <summary>動画URLから追加・保存容量の管理</summary>
  <h2>URLを指定してダウンロード <span class="hint" title="YouTube（youtube.com / youtu.be、Shorts可）と Twitch の動画URLに対応しています。ダウンロードした動画は下の録画一覧にそのまま並びます。監視対象に登録していないチャンネルの動画も取り込めます（その場合チャンネル欄は「(未登録チャンネル)」になります）。">ⓘ</span></h2>
  <form id="downloadForm" class="inline">
    <input type="text" id="downloadUrl" placeholder="https://www.youtube.com/watch?v=..." size="48" required>
    <button type="submit" id="downloadBtn">ダウンロード</button>
    <span id="downloadSummary" class="muted"></span>
  </form>

  <h2>ディスク使用量</h2>
  <p>合計: <strong id="totalDiskUsage">-</strong></p>
  <div class="table-scroll">
    <table id="diskUsageTable">
      <thead><tr><th>チャンネル</th><th>使用量</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="inline" id="orphanedCleanup">
    <button id="cleanupOrphanedBtn">孤立した録画ファイルを一括削除</button>
    <span class="hint" title="削除済みチャンネルの録画ファイルに加えて、登録中チャンネルに残った録画履歴の無い断片ファイル（録画が失敗してマージ前に中断された場合などに残ります）もまとめて削除します。録画が進行中のものは対象外です。">ⓘ</span>
    <span id="orphanedSummary" class="muted"></span>
  </div>
  <div id="cleanupPreview"></div>

  </details>
</main>
<script src="/js/common.js"></script>
<script src="/js/recordings.js"></script>
</body>
</html>
