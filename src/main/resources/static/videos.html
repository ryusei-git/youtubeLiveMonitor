<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>録画 - YouTube Live Monitor</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/studio.css">
</head>
<body>
<header class="masthead">
  <div class="shell">
    <a class="brand" href="/my/channels">
      <span class="brand-name">LIVE MONITOR</span>
      <span class="brand-sub">配信と録画を、ひとつの場所に。</span>
    </a>
  </div>
</header>
<nav class="globalnav" aria-label="メインメニュー">
  <div class="shell">
    <a href="/videos.html" class="active">動画・配信</a>
    <a href="/my/channels">マイチャンネル</a>
    <a href="/my/archive">アーカイブ</a>
  </div>
</nav>
<main class="shell" id="mainContent">
  <div class="pageHead"><h1>動画・配信</h1><button id="refreshVideosBtn">表示を更新</button></div>
  <p class="pageDescription">登録チャンネルの新着動画と配信を、この画面で再生できます。</p>
  <p id="error" class="error" role="alert" style="display:none;"></p>
  <p id="collectionNotice" class="muted" role="status">取得状況を確認しています…</p>
  <p id="videoRefreshStatus" class="muted" role="status">表示を読み込み中…</p>
  <form id="videoFilterForm" class="inline">
    <label>検索 <input id="videoKeyword" type="search" placeholder="タイトル・チャンネル名" maxlength="200"></label>
    <label>チャンネル <select id="videoChannel"><option value="">すべて</option></select></label>
    <button type="submit">検索</button>
  </form>
  <section class="videoSection" aria-labelledby="nowHeading">
    <div class="videoSectionHead">
      <h2 id="nowHeading">配信中・配信予定 <span class="muted" id="nowSummary"></span></h2>
      <div class="videoPager"><button id="nowPrev" aria-label="配信中・配信予定の前のページ">前へ</button><span id="nowPage" class="muted"></span><button id="nowNext" aria-label="配信中・配信予定の次のページ">次へ</button></div>
    </div>
    <div id="nowGrid" class="videoGrid"></div>
  </section>
  <section class="videoSection" aria-labelledby="streamsHeading">
    <div class="videoSectionHead">
      <h2 id="streamsHeading">配信済み <span class="muted" id="streamsSummary"></span></h2>
      <div class="videoPager"><button id="streamsPrev" aria-label="配信済みの前のページ">前へ</button><span id="streamsPage" class="muted"></span><button id="streamsNext" aria-label="配信済みの次のページ">次へ</button></div>
    </div>
    <div id="streamsGrid" class="videoGrid"></div>
  </section>
  <section class="videoSection" aria-labelledby="uploadsHeading">
    <div class="videoSectionHead">
      <h2 id="uploadsHeading">投稿済み <span class="muted" id="uploadsSummary"></span></h2>
      <div class="videoPager"><button id="uploadsPrev" aria-label="投稿済みの前のページ">前へ</button><span id="uploadsPage" class="muted"></span><button id="uploadsNext" aria-label="投稿済みの次のページ">次へ</button></div>
    </div>
    <div id="uploadsGrid" class="videoGrid"></div>
  </section>
  <p class="muted">新着動画は約10分ごとに取得します。収集を開始してから公開された動画と、監視中に見つかった配信を保存します。この一覧の収集では動画本体を保存しません（自動録画の設定は別です）。</p>
</main>
<script src="/js/common.js"></script>
<script src="/js/videos.js"></script>
</body>
</html>
