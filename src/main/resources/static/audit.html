<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>監査ログ - YouTube Live Monitor</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/studio.css">
</head>
<body>
<header class="masthead">
  <div class="shell">
    <a class="brand" href="/index.html">
      <span class="brand-name">LIVE MONITOR</span>
      <span class="brand-sub">配信と録画を、ひとつの場所に。</span>
    </a>
  </div>
</header>
<nav class="globalnav" aria-label="メインメニュー">
  <div class="shell">
    <a href="/videos.html">動画・配信</a>
    <a href="/index.html">ダッシュボード</a>
    <a href="/channels.html">チャンネル</a>
    <a href="/notifications.html">通知履歴</a>
    <a href="/recordings.html">録画</a>
    <a href="/users.html">利用者管理</a>
    <a href="/invitations.html">招待</a>
    <a href="/logs.html">ログ</a>
    <a href="/audit.html" class="active">監査ログ</a>
    <a href="/tables.html">DB管理</a>
    <!-- playground:start -->
    <a href="/playground.html">APIお試し</a>
    <!-- playground:end -->
  </div>
</nav>
<main class="shell" id="mainContent">
  <h1>監査ログ <span class="hint" title="ログイン・ログアウトなどの認証手続きと、利用者・チャンネル・録画などの状態を変える操作の証跡です。再生などの閲覧操作は含みません。">ⓘ</span></h1>
  <p class="pageDescription">認証手続きと状態変更操作の証跡を、期間や操作者で絞り込んで確認。</p>
  <p id="error" role="alert" class="error" style="display:none;"></p>

  <form id="filterForm" class="inline">
    <label>期間（開始） <input type="datetime-local" id="sinceFilter"></label>
    <label>期間（終了） <input type="datetime-local" id="untilFilter"></label>
    <label>操作者 <input type="search" id="usernameFilter" placeholder="利用者名"></label>
    <label>操作
      <select id="actionFilter">
        <option value="">すべての操作</option>
        <option value="LOGIN_SUCCESS">ログイン成功</option>
        <option value="LOGIN_FAILURE">ログイン失敗</option>
        <option value="LOGOUT">ログアウト</option>
        <option value="PASSWORD_CHANGE">パスワード変更</option>
        <option value="USER_CREATE">利用者作成</option>
        <option value="USER_DELETE">利用者削除</option>
        <option value="USER_DISABLE">利用者無効化</option>
        <option value="INVITATION_ISSUE">招待発行</option>
        <option value="INVITATION_REVOKE">招待取消</option>
        <option value="ACCESS_DENIED">アクセス拒否</option>
        <option value="CHANNEL_REGISTER">チャンネル登録</option>
        <option value="CHANNEL_DELETE">チャンネル削除</option>
        <option value="CHANNEL_SETTING_CHANGE">チャンネル設定変更</option>
        <option value="CHANNEL_SUBSCRIBE">チャンネル購読</option>
        <option value="CHANNEL_UNSUBSCRIBE">チャンネル購読解除</option>
        <option value="DOWNLOAD_REQUEST">ダウンロード要求</option>
        <option value="RECORDING_DELETE">録画削除</option>
        <option value="NOTIFICATION_SETTING_CHANGE">通知設定変更</option>
        <option value="APP_SETTING_CHANGE">アプリ設定変更</option>
      </select>
    </label>
    <label>結果
      <select id="outcomeFilter">
        <option value="">すべての結果</option>
        <option value="SUCCESS">成功</option>
        <option value="FAILURE">失敗</option>
      </select>
    </label>
    <label>相関ID <input type="search" id="requestIdFilter" placeholder="相関ID"></label>
    <button type="submit">絞り込み</button>
    <button type="button" id="resetBtn">条件をクリア</button>
  </form>

  <div class="table-scroll">
    <table id="auditTable">
      <thead><tr><th>発生時刻</th><th>操作者</th><th>操作</th><th>対象</th><th>結果</th><th>IP</th><th>相関ID</th><th>詳細</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="inline">
    <button id="prevBtn">前へ</button>
    <span id="pageInfo" class="muted"></span>
    <button id="nextBtn">次へ</button>
  </div>
</main>
<script src="/js/common.js"></script>
<script src="/js/audit.js"></script>
</body>
</html>
