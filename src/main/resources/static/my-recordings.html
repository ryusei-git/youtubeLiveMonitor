<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>録画 - YouTube Live Monitor</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/studio.css">
</head>
<body>
<header class="masthead">
  <div class="shell">
    <a class="brand" href="/my-channels.html">
      <span class="brand-name">LIVE MONITOR</span>
      <span class="brand-sub">配信と録画を、ひとつの場所に。</span>
    </a>
  </div>
</header>
<nav class="globalnav" aria-label="メインメニュー">
  <div class="shell">
    <a href="/videos.html">動画・配信</a>
    <a href="/my-channels.html">マイチャンネル</a>
    <a href="/my-recordings.html" class="active">録画</a>
  </div>
</nav>
<main class="shell" id="mainContent">
  <h1>録画</h1>
  <p class="pageDescription">フォロー中のチャンネルの録画を、まとめて楽しむ。</p>
  <p id="error" role="alert" class="error" role="alert" style="display:none;"></p>
  <p class="muted">あなたが購読しているチャンネルの録画です。サムネイルを押すとその場で再生します。</p>

  <!-- 再生中の動画。選ぶまでは出さない（場所だけ取って空の枠が残るのを避ける） -->
  <div id="playerBox" style="display:none;">
    <h2 id="playerTitle"></h2>
    <video id="player" class="player" controls preload="metadata"></video>
    <p><button type="button" id="closePlayer">閉じる</button></p>
  </div>

  <form id="recordingFilterForm" class="inline">
    <label>タイトル <input id="recordingKeyword" type="search" maxlength="200" placeholder="録画タイトルで検索"></label>
    <label>チャンネル <select id="recordingChannel"><option value="">すべて</option></select></label>
    <label><input id="recordingPlayable" type="checkbox"> 再生可能のみ</label>
    <button type="submit">検索</button>
  </form>
  <p id="resultSummary" role="status"></p>
  <div id="videoGrid" class="videoGrid"></div>

  <div class="inline">
    <button id="prevBtn">前へ</button>
    <span id="pageInfo" class="muted"></span>
    <button id="nextBtn">次へ</button>
  </div>
</main>
<script src="/js/common.js"></script>
<script src="/js/my-recordings.js"></script>
</body>
</html>
