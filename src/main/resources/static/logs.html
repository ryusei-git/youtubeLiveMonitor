<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログ - YouTube Live Monitor</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/studio.css">
</head>
<body>
<header class="masthead">
  <div class="shell">
    <a class="brand" href="/index.html">
      <span class="brand-name">LIVE MONITOR</span>
      <span class="brand-sub">配信と録画を、ひとつの場所に。</span>
    </a>
  </div>
</header>
<nav class="globalnav" aria-label="メインメニュー">
  <div class="shell">
    <a href="/videos.html">動画・配信</a>
    <a href="/index.html">ダッシュボード</a>
    <a href="/channels.html">チャンネル</a>
    <a href="/notifications.html">通知履歴</a>
    <a href="/recordings.html">録画</a>
    <a href="/users.html">利用者管理</a>
    <a href="/invitations.html">招待</a>
    <a href="/logs.html" class="active">ログ</a>
    <a href="/audit.html">監査ログ</a>
    <a href="/tables.html">DB管理</a>
  </div>
</nav>
<main class="shell" id="mainContent">
  <h1>ログ</h1>
  <p class="pageDescription">チャンネルやログレベルを絞って、動作状況を確認。</p>
  <p id="error" role="alert" class="error" style="display:none;"></p>

  <form id="filterForm" class="inline">
    <label>対象
      <select id="channelSelect"><option value="__system__">システムログ</option></select>
    </label>
    <label>レベル <span class="hint" title="選んだログに実際に出力されている値だけが選択肢に並びます。">ⓘ</span>
      <select id="levelSelect"><option value="">すべて</option></select>
    </label>
    <label>表示件数
      <input type="number" id="limitInput" value="200" min="1" max="2000" style="width:6rem;">
    </label>
    <button type="submit">表示</button>
    <span id="logCount" class="muted"></span>
  </form>

  <div class="table-scroll">
    <table id="logTable">
      <thead><tr><th>時刻</th><th>レベル</th><th>内容</th><th>出力元</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>
<script src="/js/common.js"></script>
<script src="/js/logs.js"></script>
</body>
</html>
