<!DOCTYPE html>
<html lang="ja" data-theme="device">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover: iPhone で画面の端（ホームインジケーターの帯）まで描き、余白は mobile.css の env(safe-area-inset-*) で取る。
     PC には安全領域が無く env() は 0 なので、PC の表示は変わらない -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YouTube Live Monitor</title>
<!-- ホーム画面に追加したとき全画面のアプリとして開く（PWA）。manifest とアイコンは未ログインでも取れる（SecurityConfig の permitAll） -->
<link rel="manifest" href="/manifest.json">
<!-- テーマを選ぶと my-app.js の mySyncThemeColor が 2 本とも書き換える。色は my-app.js の MY_THEME_COLORS と同じにする -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f0f">
<meta name="apple-mobile-web-app-title" content="Live Monitor">
<!-- manifest の display: standalone を読まない古い iOS でも、ホーム画面から開いたときにアプリとして開くため -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- ステータスバーは default（白地に黒い文字）にする。black-translucent は本文をステータスバーの下まで広げて文字を白にするので、
     白いヘッダー（.masthead）の上では時刻や電池の表示が読めなくなる。default なら本文はステータスバーの下から始まり、
     白い theme-color・ヘッダーと地続きに見える（上の余白は mobile.css でも env(safe-area-inset-top) で取っておく） -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/icons/icon-512.png">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/studio.css">
<link rel="stylesheet" href="/css/mobile.css" media="(max-width: 760px)">
</head>
<body class="userApp">
<header class="masthead">
  <div class="shell">
    <!-- 760px 以下でメニューの引き出しを開く。幅 761px 以上では隠す（studio.css）。開閉は my-app.js の myBindNavDrawer -->
    <button type="button" id="navToggle" class="navToggle" aria-label="メニューを開く" aria-expanded="false" aria-controls="mainNav"><svg class="navIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16 M4 12h16 M4 18h16"/></svg></button>
    <a class="brand" href="/my">
      <span class="brand-name">LIVE MONITOR</span>
      <span class="brand-sub">配信と録画を、ひとつの場所に。</span>
    </a>
    <!-- 送ったときの動きは my-app.js の myBindHeaderSearch。760px 以下は欄を隠し、検索の画面へのアイコン（.headerSearchLink）だけを出す -->
    <form id="headerSearchForm" class="headerSearch" role="search">
      <input id="headerSearchInput" type="search" placeholder="検索" aria-label="動画を検索">
      <button type="submit" aria-label="検索" title="検索"><svg class="navIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0 M16 16l5 5"/></svg></button>
    </form>
    <a class="headerSearchLink" href="/my/search" aria-label="検索" title="検索"><svg class="navIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0 M16 16l5 5"/></svg></a>
  </div>
</header>
<nav class="globalnav" id="mainNav" aria-label="メインメニュー">
  <!-- 引き出しの最上段。サービス名をリンクにしないのは、.globalnav a を対象にするメニューの処理（myMarkNav・decorateStudioNavigation）と
       CSS が拾うため。ホームへは直下の「ホーム」から移れる -->
  <div class="navDrawerHead">
    <button type="button" id="navClose" class="navToggle" aria-label="メニューを閉じる"><svg class="navIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16 M4 12h16 M4 18h16"/></svg></button>
    <span class="brand"><span class="brand-name">LIVE MONITOR</span></span>
  </div>
  <div class="shell">
    <!-- 今いる画面の項目の印（class="active"）は、my-app.js のルーターが画面を移るたびに付け替える -->
    <a href="/my">ホーム</a>
    <a href="/my/archive">アーカイブ</a>
    <a href="/my/discover">新人発掘</a>
    <!-- wbr: 細いメニュー（幅 1312px 以下）で 1 行に収まらない項目を、語の切れ目で折り返す。span は、wbr が flex の項目として分かれないように包む -->
    <a href="/my/download"><span>動画<wbr>ダウンロード</span></a>
    <a href="/my/upload"><span>動画<wbr>アップロード</span></a>
    <a href="/my/search">検索</a>
    <a class="navGroupLink" href="/my/videos"><span>登録<wbr>チャンネル</span></a>
    <!-- 購読しているチャンネルの行。中身は my-app.js の myLoadNavChannels が描く -->
    <div id="navChannels"></div>
    <a href="/my/channels"><span>すべての<wbr>登録<wbr>チャンネル</span></a>
    <div class="navGroupLabel">マイページ</div>
    <a href="/my/settings/notifications">通知の設定</a>
    <a href="/my/settings/account"><span>アカウント<wbr>設定</span></a>
  </div>
</nav>
<div id="navBackdrop" class="navBackdrop" hidden></div>
<!-- 録画の再生画面（/my/watch/{id}）だけ、右の列（#viewAside）を出して動画と本文の横に並べる（studio.css の .appColumns。#882）。
     右の列をドックと同じ行から始めるには main の中に置けない。ドックと main は隣のままにする -->
<div class="appColumns">
<!-- 再生中の動画。動画要素はこの 1 つだけで、DOM から外したり移したりしない（再生が止まり、小窓も閉じるため）。
     大きさは my-app.js がクラス（is-full / is-mini）で切り替える -->
<section id="playerDock" aria-label="再生中の録画" hidden>
  <video id="dockVideo" class="player" playsinline preload="metadata"></video>
  <div class="dockBar">
    <a id="dockTitle" class="dockTitle dockMiniOnly" href="/my"></a>
    <button type="button" id="dockToggle" class="dockMiniOnly" aria-label="再生" title="再生">▶</button>
    <button type="button" id="dockBack" class="dockSeek" title="10秒戻す（再生画面では J キーでも）">-10秒</button>
    <button type="button" id="dockForward" class="dockSeek" title="10秒進める（再生画面では L キーでも）">+10秒</button>
    <label class="dockRateLabel">速度 <select id="dockRate" title="再生速度（&lt; と &gt; のキーでも変えられます）"></select></label>
    <button type="button" id="dockPip" hidden>小窓で再生</button>
    <button type="button" id="dockClose" class="dockMiniOnly" aria-label="閉じる" title="閉じる">✕</button>
  </div>
</section>
<main class="shell" id="view"></main>
<aside id="viewAside" class="watchSecondary" aria-labelledby="watchSecondaryHeading" hidden></aside>
</div>
<script src="/js/common.js"></script>
<script src="/js/my-search.js"></script>
<script src="/js/my-discover.js"></script>
<script src="/js/my-app.js"></script>
</body>
</html>
