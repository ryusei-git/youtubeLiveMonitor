<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ダッシュボード</title>
<link rel="stylesheet" href="/css/system.css">
</head>
<body>
<header class="topNav">
  <button type="button" class="topButton" id="navToggle" aria-label="メニューを開く" aria-expanded="false" aria-controls="sideNav">
    <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
  </button>
  <a class="brand" href="#mainContent">
    <svg class="brandIcon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M1.5 1.5h5.5v5.5H1.5zM9 1.5h5.5v5.5H9zM1.5 9h5.5v5.5H1.5zM9 9h5.5v5.5H9z"/></svg>
    ダッシュボード
  </a>
</header>
<div class="navScrim" id="navScrim" hidden></div>
<div class="layout">
  <nav class="sideNav" id="sideNav" aria-label="メニュー">
    <ul class="navGroup">
      <li>
        <a href="#mainContent" class="navItem is-active" aria-current="page">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M1.5 2.5h13v9h-13zM5.5 14.5h5M8 11.5v3"/></svg>
          <span class="navName">端末の状態</span>
        </a>
      </li>
    </ul>
    <p class="navGroupLabel" id="serviceNavLabel">サービス</p>
    <ul class="navGroup" id="serviceNav" aria-labelledby="serviceNavLabel"></ul>
  </nav>
  <main id="mainContent">
    <div class="pageHeader">
      <div class="headerTitle">
        <h1>端末の状態</h1>
        <details class="help">
          <summary aria-label="端末の状態の説明">
            <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M6.2 6.3a1.9 1.9 0 1 1 2.5 1.8c-.4.2-.7.5-.7 1v.4M8 11.3v.2"/></svg>
          </summary>
          <div class="popoverBody">値は 1 分ごとに計測します。画面は 10 秒ごとに最新の計測を取りに行きます。グラフは直近 3 時間分で、YouTube Live Monitor を再起動すると、それまでの記録は消えます。</div>
        </details>
      </div>
      <dl class="summaryItems">
        <div>
          <dt>端末名</dt>
          <dd id="hostName">-</dd>
        </div>
        <div>
          <dt>端末の稼働時間</dt>
          <dd id="uptime">-</dd>
        </div>
        <div>
          <dt>最終更新</dt>
          <dd id="updatedAt">-</dd>
        </div>
      </dl>
      <button type="button" class="btn iconOnly" id="refreshButton" aria-label="表示を更新">
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M12.5 1.5v3h-3"/></svg>
      </button>
    </div>
  </main>
</div>
<script src="/js/common.js"></script>
<script src="/js/system.js"></script>
</body>
</html>
