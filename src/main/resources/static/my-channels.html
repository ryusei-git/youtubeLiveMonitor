<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイチャンネル - YouTube Live Monitor</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/studio.css">
</head>
<body>
<header class="masthead">
  <div class="shell">
    <a class="brand" href="/my-channels.html">
      <span class="brand-name">LIVE MONITOR</span>
      <span class="brand-sub">配信と録画を、ひとつの場所に。</span>
    </a>
  </div>
</header>
<nav class="globalnav" aria-label="メインメニュー">
  <div class="shell">
    <a href="/videos.html">動画・配信</a>
    <a href="/my-channels.html" class="active">マイチャンネル</a>
    <a href="/my-recordings.html">録画</a>
  </div>
</nav>
<main class="shell" id="mainContent">
  <h1>マイチャンネル</h1>
  <p id="error" role="alert" class="error" role="alert" style="display:none;"></p>

  <h2>チャンネルを追加 <span class="hint" title="チャンネルページのURLをそのまま貼り付けできます（YouTube: https://www.youtube.com/@foo、Twitch: https://www.twitch.tv/foo）。">ⓘ</span></h2>
  <p class="muted">配信が始まると、この一覧の状態が「配信中」に変わります。</p>
  <form id="addForm" class="inline">
    <select id="addPlatform" aria-label="配信プラットフォーム"></select>
    <input type="text" id="addChannelInput" placeholder="URL / @ハンドル / チャンネルID" size="32" required aria-label="チャンネルURL・ハンドル・ID">
    <input type="text" id="addChannelName" placeholder="表示名（省略可）" size="18" aria-label="表示名">
    <button type="submit">追加</button>
  </form>

  <h2>購読しているチャンネル</h2>
  <p class="muted">
    録画を「する」にすると、条件に合う配信が自動で保存されます。保存された動画は
    <a href="/my-recordings.html">録画</a>から見られます。<br>
    設定はあなた専用です。ただし<strong>同じチャンネルを他の人も録画している場合、
    あなたが「しない」にしても録画自体は続きます</strong>（保存先が共通のため）。
  </p>
  <div class="table-scroll">
    <table id="myChannelTable">
      <thead>
        <tr>
          <th>配信元</th>
          <th>名前</th>
          <th>状態</th>
          <th>録画</th>
          <th>条件</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div id="myChannelEmpty" style="display:none;"></div>
</main>
<script src="/js/common.js"></script>
<script src="/js/my-channels.js"></script>
</body>
</html>
